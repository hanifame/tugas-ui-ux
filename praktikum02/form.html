<body>
    <h1>Black goese bistro | Pizza-on-Demand</h1>
    <p>
        our pizza 12&quet; wood-fired pizza are available for delivery.
    </p>
    <form action="http://www.blackgoosebistro.com/pizza.php" method="post">
        <fieldset border="1">
            <legend>your information</legend>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>

            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address">
            </p>

            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>

            <p>
                <label for="instruction">delivery instruction:</label>
                <textarea
                id="instruction"
                name="instruction"
                rows="4"
                cols="50"
                maxlength="400"
                placeholder="no more than 400 characters"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>design your dream pizza</legend>
            <p>pizza specs</p>
            <p>pilih 1:</p>

            <p>
                <input type="radio" id="classic" name="crust" value="Classic white" required>

                <label for="multigrain">Multigrain</label><br>

                <input type="radio" id="cheese" name="crust" value="Cheese" required>
                <label for="cheese">Cheese</label><br>
                
                <input type="radio" id="gluten" name="crust" value="Gluten" required>
                <label for="gluten">Gluten</label><br>
            </p>

            <p>toping</p>

            <p>
                <input type="checkbox" id="redsauce" name="topping" value="Red sauce" checked>
                <label for="redsauce">Red sauce</label><br>
                <input type="checkbox" id="redsauce" name="topping" value="Red sauce">
                <label for="redsauce">Red sauce</label><br>
                <input type="checkbox" id="redsauce" name="topping" value="Red sauce">
                <label for="redsauce">Red sauce</label><br>

                <label for="redsauce">Red sauce</label><br>

                <label for="redsauce">Red sauce</label><br>

                <label for="redsauce">Red sauce</label><br>
                <input type="checkbox" id="redsauce" name="topping" value="Red sauce">
                <label for="redsauce">Red sauce</label><br>
                <input type="checkbox" id="redsauce" name="topping" value="Red sauce">
                <label for="redsauce">Red sauce</label><br>
            </p>

            <p>
                <label for="quantity">quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p>
