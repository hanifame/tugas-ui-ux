<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prak2_kelompok_6_desainuiux_pemweb</title>
  </head>
  <body>
    <header>
      <h1 align="center">Toko Handphone</h1>
      <p align="center">Temukan handphone terbaik untuk Anda</p>
      <hr />
      <nav align="center">
        <a href="#">home</a> |
        <a href="#">hasil pemesanan</a>
      </nav>
    </header>
    <hr />
    <table>
      <tr>
        <td valign="top" width="160px">
          <img
            src="img/images.jpg"
            alt="gambar hp samsung"
            width="145px"
            height="145px"
          /><br />
          <input type="file" name="gambar" accept="img/" />
        </td>
        <td>
          <form action="hasil.html" method="post">
            <label for="title">Title Here:</label>
            <input
              type="text"
              id="title"
              name="title"
              value="Sumsang"
              required
            /><br /><br />
            <label for="description">Description:</label>
            <textarea
              id="description"
              name="description"
              rows="6"
              cols="30"
              required
            >
Year: 2029

Model:

Condition: Mint
            </textarea
            ><br /><br />
            <label for="account">Account Number:</label>
            <input
              type="text"
              value="123-456-789-0"
              size="28"
              required
            /><br /><br />
            <label for="bank">Bank:</label>

            <select id="daftar-bank">
              <option value="BCD" selected>BCD</option>
              <option value="BNA">BNA</option>
              <option value="BRU">BRU</option>
              <option value="Mandari">Mandari</option></select
            ><br /><br />
            <label for="holder">Account Holder:</label>
            <input
              type="text"
              id="holder"
              name="holder"
              value="Name here"
              required
            /><br /><br />
            <label for="number">Transaction:</label>
            <input
              type="number"
              name="number"
              min="1"
              max="3"
              value="1"
              required
            /><br />
            * if the transaction is for 3 person, choose 3 from the drop-down
            list<br /><br />
            <input type="checkbox" id="mobile" name="mobile" checked />
            <label for="mobile">Send to Mobile Phone</label><br /><br />
            <input type="checkbox" id="email" name="email" checked />
            <label for="email">Send to Email</label><br /><br />
            <label for="phone">Send to mobile phone</label>
            <input
              type="text"
              id="phone"
              name="phone"
              value="123-456-135-6"
              required
            /><br /><br />
            <label for="surel">Send to Email</label>
            <input
              type="text"
              id="surel"
              name="surel"
              value="abcabcd@gmail.com"
              required
            /><br /><br />
            <input type="submit" value="Generate Nabr Link" />
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
